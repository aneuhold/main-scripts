services:
  influxdb:
    image: influxdb:2
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: "${INFLUXDB_ADMIN_PASSWORD}"
      DOCKER_INFLUXDB_INIT_ORG: "${INFLUX_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${INFLUX_BUCKET}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${INFLUX_TOKEN}"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

  traffic-collector:
    image: node:24-alpine
    container_name: traffic-collector
    # Node runs the TypeScript source directly (type stripping). The .mts
    # extension pins it to ESM without a package.json.
    command: ["node", "/app/trafficCollector.mts"]
    environment:
      ROUTER_HOST: "${ROUTER_HOST}"
      ROUTER_USER: "${ROUTER_USER}"
      ROUTER_PASSWORD: "${ROUTER_PASSWORD}"
      # The router's web UI serves a self-signed certificate.
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      INFLUX_URL: "http://influxdb:8086"
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG}"
      INFLUX_BUCKET: "${INFLUX_BUCKET}"
    volumes:
      - ./traffic-collector/trafficCollector.mts:/app/trafficCollector.mts:ro
    depends_on:
      - influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Consumed by the provisioned InfluxDB datasource.
      INFLUX_TOKEN: "${INFLUX_TOKEN}"
      INFLUX_ORG: "${INFLUX_ORG}"
      INFLUX_BUCKET: "${INFLUX_BUCKET}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb_data:
  grafana_data:

name: 'Main Branch Actions'

on:
  push:
    # Only initiate the workflow when the main branch is pushed to
    branches:
      - main

jobs:
  publish:
    name: 'Publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for testing actions that use OIDC to access other resources (like npm publish)
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure the npm registry
        # Writes the .npmrc that `npm publish` reads, which npm requires for
        # OIDC: https://docs.npmjs.com/trusted-publishers. No node-version is
        # given because pnpm/setup below installs the runtime.
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: Build
        run: pnpm build

      # We need later than 11.5.1 of NPM for OIDC support
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish --access public

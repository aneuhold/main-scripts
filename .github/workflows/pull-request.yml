name: 'Pull Request Actions'

on:
  pull_request:
    # Only initiate the workflow when a PR is opened, or committed to.
    branches:
      - main

jobs:
  test:
    name: 'Test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for testing actions that use OIDC to access other resources (like npm publish)
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure the npm registry
        # Writes the .npmrc that `npm publish` reads, which npm requires for
        # OIDC: https://docs.npmjs.com/trusted-publishers. No node-version is
        # given because pnpm/setup below installs the runtime.
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm, Node.js, and install dependencies
        uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - name: Run build
        run: pnpm build

      - name: Run Linting
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Dry run publish to NPM
        run: npm publish --access public --dry-run
